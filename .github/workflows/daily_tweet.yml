name: Daily Dev Content — Telegram

on:
  schedule:
    - cron: '30 3 * * *'   # 9 AM IST
    - cron: '30 7 * * *'   # 1 PM IST
    - cron: '30 15 * * *'  # 9 PM IST
  workflow_dispatch:
    inputs:
      niche:
        description: 'Content niche'
        required: false
        default: 'system_design'
        type: choice
        options: [system_design, webdev, career]
      topic:
        description: 'Specific topic (leave empty for auto)'
        required: false
        default: ''
      content_type:
        description: 'Thread or single tweet'
        required: false
        default: 'thread'
        type: choice
        options: [thread, single]
      dry_run:
        description: 'Dry run (no actual posting)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip -q
          pip install httpx pydantic pydantic-settings python-dotenv Pillow matplotlib -q

      - name: Create folders
        run: mkdir -p logs tmp/cards data

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MPLBACKEND: Agg
        run: |
          NICHE="${{ github.event.inputs.niche || 'system_design' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          TYPE="${{ github.event.inputs.content_type || 'thread' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ -z "${{ github.event.inputs.niche }}" ]; then
            if [ "$HOUR" -lt 11 ]; then
              NICHE="system_design"
            elif [ "$HOUR" -lt 15 ]; then
              NICHE="webdev"
            else
              NICHE="career"
            fi
          fi

          echo "Posting: niche=$NICHE topic=$TOPIC type=$TYPE dry_run=$DRY_RUN"

          CMD="python -m src.pipeline --niche $NICHE --type $TYPE"
          [ -n "$TOPIC" ] && CMD="$CMD --topic \"$TOPIC\""
          [ "$DRY_RUN" = "true" ] && CMD="$CMD --dry-run"
          eval $CMD

      - name: Keep repo active
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(TZ=Asia/Kolkata date '+%d %b %Y %I:%M %p IST')" > .last_run
          git add .last_run data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update topic tracker [skip ci]"
          git push || true

      - name: Upload logs + cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            logs/
            tmp/cards/
          retention-days: 7
